name: Experiment 4 profiling checks
on:
  push:
    branches: [experiment/simple-statistical-profiling]
  workflow_dispatch:
jobs:
  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_experiment4.py' -v
