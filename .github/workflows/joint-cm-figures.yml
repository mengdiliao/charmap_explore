name: Render Joint CM thesis figures
on:
  push:
    branches: ['experiment/simple-statistical-profiling']
    paths:
      - 'scripts/joint_cm_plotting.py'
      - 'scripts/plot_joint_cm_*.py'
      - 'requirements-plotting.txt'
      - '.github/workflows/joint-cm-figures.yml'
      - 'results/joint_cm_comparison.csv'
      - 'results/joint_cm_sensitivity.csv'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: joint-cm-figures-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-plotting.txt
      - name: Render all figures
        run: |
          python scripts/plot_joint_cm_comparison.py
          python scripts/plot_joint_cm_sensitivity.py
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from PIL import Image
          root = Path('results/figures')
          for group in ('comparison','sensitivity'):
              p = root / group
              for ext in ('svg','pdf','png'):
                  files = list(p.glob('*.'+ext))
                  assert len(files)==4, (group,ext,len(files))
                  for f in files:
                      assert f.stat().st_size>1000, f
                      if ext=='svg':
                          ET.parse(f)
                      elif ext=='pdf':
                          assert f.read_bytes().startswith(b'%PDF-')
                      else:
                          with Image.open(f) as im:
                              assert min(im.size)>500, f
                              im.verify()
          print('Verified eight figure sets in three formats (24 files).')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: joint-cm-thesis-figures
          path: results/figures/
          if-no-files-found: error
      - name: Publish figures to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/figures/
          if ! git diff --cached --quiet; then
            git commit -m "Render eight Joint CM thesis figure sets"
            git push origin HEAD:experiment/simple-statistical-profiling
          fi
