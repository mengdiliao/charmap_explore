name: Shalla partition size sensitivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/charmap/**'
      - 'scripts/verify_java_parity.py'
      - '.github/workflows/partition-sensitivity.yml'
permissions:
  contents: read
  actions: read
jobs:
  sensitivity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - p: 500
            budget: 32
          - p: 500
            budget: 64
          - p: 500
            budget: 128
          - p: 500
            budget: 256
          - p: 2000
            budget: 128
          - p: 2000
            budget: 256
          - p: 2000
            budget: 512
          - p: 2000
            budget: 1024
          - p: 8000
            budget: 512
          - p: 8000
            budget: 1024
          - p: 8000
            budget: 2048
          - p: 8000
            budget: 4096
          - p: 8000
            budget: 256
          - p: 32000
            budget: 2048
          - p: 32000
            budget: 4096
          - p: 32000
            budget: 8192
          - p: 32000
            budget: 16384
          - p: 32000
            budget: 256
          - p: 128000
            budget: 8192
          - p: 128000
            budget: 16384
          - p: 128000
            budget: 32768
          - p: 128000
            budget: 65536
          - p: 128000
            budget: 256
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: shalla-dataset-and-official-workloads
          run-id: 44195004791
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Verify full source data and workloads
        run: |
          echo '081bf7628046d046533f63ed2e049e4aff6bd21d3151b64a41c8cbfc584a4a2a  data/shalla/dataset.txt' | sha256sum -c -
          echo '095d4cbd2cc6091bd6a660ad0826c203b00b8d70c364a0eb8319b86d49529fb8  data/shalla/queries_uniform.txt' | sha256sum -c -
          echo '7058cc63df718c76872a6788a35161a2d19156db739c4400f2a548799559cc52  data/shalla/queries_zipf.txt' | sha256sum -c -
      - run: mkdir -p build/classes && javac --release 21 -d build/classes src/charmap/*.java
      - name: Full weighted evaluation
        run: |
          java -Xmx4g -cp build/classes charmap.PartitionSensitivity data/shalla results/p${{ matrix.p }}_b${{ matrix.budget }} ${{ matrix.p }} ${{ matrix.budget }}
          cp data/shalla/manifest.json results/p${{ matrix.p }}_b${{ matrix.budget }}/source_manifest.json
      - name: Compare Java to archived C++ results
        run: python3 scripts/verify_java_parity.py results/p${{ matrix.p }}_b${{ matrix.budget }}/results.csv results/shalla_partition_sensitivity.csv
      - uses: actions/upload-artifact@v4
        with:
          name: partition-p${{ matrix.p }}-b${{ matrix.budget }}
          path: |
            results/**/results.csv
            results/**/source_manifest.json
          retention-days: 30
