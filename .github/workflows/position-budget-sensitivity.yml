name: Position-budget sensitivity of Experiment 3 winners
on:
  push:
    branches: ['experiment/position-budget-sensitivity']
    paths:
      - '.github/workflows/position-budget-sensitivity.yml'
      - 'scripts/position_budget_sensitivity.py'
      - 'experiments/position_budget_sensitivity/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  selected-designs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        partition_size: [500, 2000, 8000, 32000, 128000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate best-of-AI/random candidate selection
        run: python3 scripts/position_budget_sensitivity.py validate
      - uses: actions/download-artifact@v4
        with:
          name: shalla-dataset-and-official-workloads
          run-id: 44195004791
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Benchmark 4 selected maps, reference and Bloom at all budgets
        run: |
          python3 scripts/position_budget_sensitivity.py run \
            --partition-size ${{ matrix.partition_size }} \
            --data data/shalla \
            --out /tmp/position-sweep-p${{ matrix.partition_size }}
      - name: Upload validated partition sweep
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: position-sensitivity-p${{ matrix.partition_size }}
          path: /tmp/position-sweep-p${{ matrix.partition_size }}/p${{ matrix.partition_size }}.csv
          if-no-files-found: error
          retention-days: 90

  merge-results:
    needs: selected-designs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: position-sensitivity-p*
          path: /tmp/position-sweep-all
          merge-multiple: true
      - name: Validate complete 322-row matrix and original Experiment 3 anchor
        run: |
          python3 scripts/position_budget_sensitivity.py merge \
            --source-dir /tmp/position-sweep-all \
            --output results/position_budget_sensitivity.csv
          cat results/position_budget_sensitivity.md
      - name: Archive combined CSV and summary
        uses: actions/upload-artifact@v4
        with:
          name: position-budget-sensitivity-combined
          path: |
            results/position_budget_sensitivity.csv
            results/position_budget_sensitivity.md
          if-no-files-found: error
          retention-days: 90
      - name: Publish completed results on experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/position_budget_sensitivity.csv results/position_budget_sensitivity.md
          if git diff --cached --quiet; then
            echo "No new result changes"
          else
            git commit -m "Publish validated 23-config selected-position sensitivity results"
            git push origin HEAD:experiment/position-budget-sensitivity
          fi
