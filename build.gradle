plugins {
    id 'java'
}

group = 'charmap'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
test {
    useJUnitPlatform()
    maxHeapSize = '1g'
    testLogging { events 'passed', 'failed', 'skipped' }
}

def prop = { String key, String fallback ->
    providers.gradleProperty(key).orElse(fallback).get()
}
def experiment = { String name, String entry, Closure arguments, String descriptionText ->
    tasks.register(name, JavaExec) {
        group = 'experiments'
        description = descriptionText
        dependsOn tasks.named('classes')
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'charmap.experiments.' + entry
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        maxHeapSize = prop('heap', providers.environmentVariable('JAVA_HEAP').orElse('4g').get())
        workingDir = projectDir
        args arguments()
    }
}
def data = { prop('dataDir', 'data/shalla') }
def p = { prop('partitionSize', '8000') }
def budget = { prop('budget', '512') }

experiment('shallaPilot', 'ShallaPilot', {
    def b = prop('budget', '256')
    [data(), prop('outputDir', 'results/java_unified_pilot_' + b), b]
}, 'Run Experiment 1 full Shalla baseline pilot (P=500).')
experiment('partitionSensitivity', 'PartitionSensitivity', {
    [data(), prop('outputDir', 'results/java_unified_p' + p() + '_b' + budget()), p(), budget()]
}, 'Run one Experiment 2 partition-size/budget combination.')
experiment('jointProfile', 'JointProfile', {
    [data(), prop('outputDir', 'results/java_unified_joint_profile')]
}, 'Profile both joint tuples across the full partition/budget matrix.')
experiment('positionEvaluator', 'PositionEvaluator', {
    [data(), prop('outputDir', 'runs/experiment3_unified_hashing/benchmark'), p(), budget(),
     prop('candidates', 'runs/experiment3_unified_hashing/designs.tsv'), prop('seed', '55')]
}, 'Evaluate frozen AI/random position combinations, Bloom, and Oracle (Experiment 3).')

experiment('experiment4Evaluator', 'PositionEvaluator', {
    [prop('datasetFile', 'data/shalla/dataset.txt'), prop('queryFile', 'data/shalla/queries_uniform.txt'),
     prop('workload', 'uniform'), prop('outputDir', 'runs/experiment4_uniform/evaluation'), p(), budget(),
     prop('candidates', 'runs/experiment4_uniform/designs.tsv'), prop('seed', '55')]
}, 'Evaluate a selected full workload and frozen position combinations (Experiment 4).')
